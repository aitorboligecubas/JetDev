<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JetDev Demo</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, #f6f8fb 0%, #eef2f9 100%);
        color: #1b2430;
      }
      main {
        width: min(680px, 92vw);
        padding: 2rem;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #445064;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>JetDev Preview</h1>
      <p>This is a generated preview page, ready to deploy instantly as a static site.</p>
    </main>
  </body>
</html>
